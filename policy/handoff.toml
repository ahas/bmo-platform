# The handoff a supervisor's session going away is asked for before a fresh session replaces it
# (docs/sessions.md, 「A restart hands the session over」): how long agency waits before asking again while
# one is under way, how long the ask waits for the receiver's answer at most, and the reasons it names, each by
# what makes the session go.
retry_seconds = 5
# The ceiling on one ask: long enough for any note a session writes, so an ask still unanswered past it waits on
# something that will not come, and the fresh session opens without the note.
wait_seconds = 1800
# The least time between two asks for the same session's handoff: an ask sooner waits out the rest of it and is
# then made, never skipped, so a turn that keeps failing does not ask in a loop.
again_seconds = 60
# How often agency looks again whether an asynchronous call asked under a replaced supervisor program's tool
# record still runs, before it takes that record back.
calls_look_seconds = 30

[reasons]
lost = "the kept session is gone: the program no longer holds it"
replaced = "a fresh session replaces the one the agent had"
moved = "the documents the session's prompt is composed from changed"
road = "the road its session went out on changed"
reset = "a reset of its session was asked"
