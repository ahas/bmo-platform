# The rest a usage limit calls for, begun by whichever process
# reads a done run's session usage.

# How long a login is put aside when its limit named no reset moment, in seconds.
fallback_seconds = 3600

# What the owner is told as the rest begins, where it is the rest that silenced the last open login.
resting = "I have thought too hard today... I am going to rest for a while, until the limit lifts."

# How often the deployment is looked at for a silence no written rest told, in seconds (docs/api.md,
# 「accounts, rest and usage」).
lift_check_seconds = 30
