# DeepSeek's own API, reached by Claude Code through agency's gateway member, with the key the gateway's
# member names (docs/own-llm.md, 「The gateway's members」). Read by this provider's own declaration on each
# side.

# The provider's name as a screen shows it.
label = "DeepSeek"

# The lines its program carries. Its runs are Claude Code's on the gateway, which carries the chat, a worker's
# job, a gate's one-request judgement and a search's own run.
lines = ["chat", "gate", "worker", "search"]

# A mapping of it carries a ceiling on the answer's tokens: its member names one.
caps_answer_tokens = true

# Its engine is not the owner's own: what a session reads goes to the outside service.
owners_engine = false

# The share of a model's window a session may fill before it is folded, at a tier the fold-ratio table
# holds no row for (docs/sessions.md, 「Session compaction」): half the window.
fold_ratio = 0.5

[effort]
# Every effort word a mapping of it may hold, in the order a screen shows them. `none` is DeepSeek's
# own word for a run that does not think.
words = ["none", "low", "medium", "high", "max"]
# A mapping may also name no effort, which leaves the word to DeepSeek.
none_held = true
# What a launch makes of the mapping's word: either is taken, and `none` is a launch without thinking.
launch = "either"

[presence]
# The member's key file under the data root's env directory, private to its owner.
key_file = "deepseek.key"
# What it says where the key file or the gateway's key file is not usable: the kebab-case code a screen words
# in its own language, and the English sentence the log keeps.
missing_code = "deepseek-key-unusable"
missing = "DeepSeek cannot be chosen: its member's key file (deepseek.key) or the gateway's key file is missing or its mode is not 0600."
# What a pin or a job naming a model this provider does not serve says; the name follows it.
not_held = "Not a DeepSeek model"

[claude]
# The Claude Code effort word a run goes out with, by the word its tier mapping or its agent named. A word
# this table does not hold leaves the launch at Claude Code's own word for whether the run thinks.
effort = { none = "low", low = "low", medium = "medium", high = "high", max = "max" }

[resident]
# The keys typed into the pane of its standing program, Claude Code, that cut a working turn short
# (docs/agent-control.md, 「Stopping」).
interrupt = ["escape"]
# Its surface carries its own turns: put into Claude Code's transcript door and read back out of its record.
turns = "endpoint"
# Words put in while a turn works are taken into that turn.
words_mid_turn = true
# A conversation grown to its mark is handed over by a turn asking it for its note, which a new session
# opens with.
handover = "handoff"
# A conversation's turn is watched for going nowhere and cut at the conversation limits.
turn_limits = true
# No engine of its own holds a slot; every request goes to DeepSeek's API.
waits_for_engine = false

# The dsh route the road no longer uses; kept for a rollback to the dsh harness, which no run of this build
# names.
[dsh]
api = "https://api.deepseek.com/v1"
api_env = "BMO_DEEPSEEK_DSH_API_URL"
key_env = "DEEPSEEK_API_KEY"
key_file = "deepseek.key"

[balance]
# What the account has left, asked with the road's key file on a clock (docs/usage-windows.md,
# 「Balances」): where it is asked, the variable a test names a stand-in's address in, how often it is read
# and for how many passes a reading stands; and, for a balance spent, where a person tops it up
# (docs/cache-fallback.md, 「One road resolution」).
url = "https://api.deepseek.com/user/balance"
url_env = "BMO_DEEPSEEK_BALANCE_URL"
pass_seconds = 300
fresh_passes = 6
top_up = "top the DeepSeek balance up at https://platform.deepseek.com/top_up"

[top_up]
# The supervisor's tool that tops the balance up by an amount the owner names (docs/tools.md, 「The DeepSeek
# top-up」). DeepSeek has no payment API: the tool pays on its web platform, in the owner's own Firefox, its own
# profile and sign-in, with the platform's card, signing in with the platform's DeepSeek login only where the
# platform asks for it.

# Why one call is held to a cap, said with the cap where an amount is over it.
cap_reason = "one call tops the balance up by no more than this, so that a mistaken amount or a repeated call cannot spend more; a larger top-up is a person's own, made on DeepSeek's platform"

# The two secrets of the console's store the tool reads, each one `KEY=VALUE` line to a field: what its answers
# call it, the console's kind it is saved in and its fields. Which secret of the platform administrator's space,
# the data root's `env/`, holds each is agency's setting `deepseekCardSecret` or `deepseekLoginSecret`
# (docs/api.md, 「settings」), the owner's to change with no deployment.
[top_up.card]
called = "card"
kind = "card"
fields = ["CARD_NUMBER", "CARD_EXPIRY", "CARD_CVC", "CARD_HOLDER_NAME"]

[top_up.login]
called = "DeepSeek login"
kind = "account-login"
fields = ["USERNAME", "PASSWORD"]

# The largest amount one call names, by the currency DeepSeek keeps the balance in; a currency this table holds
# no cap for is not topped up.
[top_up.cap]
USD = 50
CNY = 350

# The platform the tool pays on and the browser it pays in: the platform's origin and its two pages, the
# currencies its card road pays a balance in (a balance in yuan is paid by scanning, a person's own), and the
# owner's Firefox: its executable, the folder under `$HOME` its profiles and `profiles.ini` stand in, the user scope
# its snap's launcher expects to start in, and the virtual screen it is started on.
[top_up.platform]
address = "https://platform.deepseek.com"
top_up_path = "/top_up"
sign_in_path = "/sign_in"
card_currencies = ["USD"]
firefox = "/snap/bin/firefox"
profiles = "snap/firefox/common/.mozilla/firefox"
scope = "snap.firefox.firefox"
screen = "1280x900x24"

# Each wait of a call, in seconds: the browser announcing its endpoint and answering each command, each step's
# page or control, the outcome of a payment pressed with a person's confirmation in it, the balance reader's next
# reading after a payment, past its five-minute pass, and DeepSeek's mail for the sign-in's check; and how often a
# waited page is looked at, in milliseconds, and the balance and the mailbox, in seconds.
[top_up.waits]
start = 30
step = 45
confirm = 300
balance = 420
mail = 180
look_ms = 500
balance_look = 15
mail_look = 5

# The mail that approves the sign-in's check (docs/tools.md, 「Where a person is asked」): the domains DeepSeek
# mails from and links to, each matched with its subdomains; the words an approval link's address or text holds;
# and how many digits a sign-in code has.
[top_up.mail]
senders = ["deepseek.com"]
link_words = ["approve", "confirm", "verify", "authorize", "allow"]
code_digits = 6

# The words the platform's English pages show its controls and outcomes by, each matched without regard to case.
[top_up.page]
identity = ["Phone number / email address", "email address"]
password = ["Password"]
password_tab = ["Password login", "Login with password"]
sign_in = ["Log in"]
custom_amount = ["Custom"]
amount = ["Amount", "Custom"]
# The card is paid through the platform's own card processor, whose way to pay shows only the card networks'
# marks, named for a reader by their labels. The way to pay labelled "Debit or Credit Card" is PayPal's guest
# checkout, which asks for a mail address, a billing address and a phone behind a reCAPTCHA, and is never chosen.
card_method = ["Visa", "Mastercard"]
next_step = ["Next step"]
pay = ["Pay"]
card_number = ["Card number"]
card_expiry = ["Expiry", "Expiration", "MM / YY", "MM/YY"]
card_cvc = ["CVV", "CVC", "Security code"]
card_holder = ["Cardholder", "Name on card"]
paid = ["Payment successful"]
refused = ["Payment failed", "Recharge failed", "Invalid card", "card type not supported", "Insufficient balance", "Order timed out", "Card declined"]
sign_in_refused = ["password is incorrect", "Login failed", "account was suspended", "account has been suspended"]
person_asked = ["confirm you are human", "security check"]
person_asked_frames = ["hcaptcha.com", "challenges.cloudflare.com", "captcha.awswaf.com"]
identity_asked = ["real-name verification", "Identity Verification"]
check_asked = ["Verify your account", "Enter verification code", "confirmation link", "check your email"]
send_code = ["Send code"]
code_field = ["verification code", "code"]
code_submit = ["Verify and log in", "Verify", "Confirm"]

# What the tool answers. Each `{name}` is filled in with what it names.
[top_up.words]
# The call named no amount above zero.
no_amount = "Name the amount to top the DeepSeek balance up by: a number above zero, in the currency DeepSeek keeps the balance in."
# Agency's settings could not be read, so the secrets are unknown.
settings_unasked = "Agency's settings could not be read for the DeepSeek top-up's secrets: {why}"
# Agency's setting names no secret.
secret_unnamed = "No {called} secret is named for the DeepSeek top-up: fill agency's setting {setting} with the name of the console secret, of the kind {kind}, the {called} is saved in, then call again."
# The secret stands nowhere.
secret_missing = "No {called} is saved for the DeepSeek top-up: ask for the secret {secret} in the kind {kind} in the console's secret store, then call again."
# The secret lacks fields, named by their keys.
secret_lacks = "The {called} saved as {secret} lacks {fields}: save it again in the kind {kind} with every field filled."
# Agency could not say what the balance reader last read.
balance_unasked = "The DeepSeek balance could not be read from agency: {why}"
# The balance reader has not read the balance, so its currency is unknown.
balance_unread = "The DeepSeek balance has not been read yet, so the currency a top-up is named in is unknown: call again once its balance reader has read it."
# The currency the balance is kept in has no cap.
no_cap = "No single top-up cap is held for {currency}, so no top-up is made in it."
# The amount is over the cap.
over_cap = "{amount} {currency} is over the single top-up cap of {cap} {currency}: {reason}."
# The balance is kept in a currency the platform takes no card for.
no_card_road = "Nothing was paid: DeepSeek takes no card for a balance kept in {currency}, only a payment a person scans; a person is to {top_up}."
# Another call drives the owner's Firefox.
busy = "Nothing was paid: another DeepSeek top-up is under way on this machine. Call again once it has answered."
# The owner's Firefox is open on its profile, which the top-up pays in.
firefox_open = "Nothing was paid: the owner's Firefox is open on this machine, and the top-up pays in his Firefox's own profile, which one Firefox opens at a time. Call again once Firefox is closed."
# The browser could not be started or reached.
browser_failed = "Nothing was paid: the browser the DeepSeek top-up pays in could not be started: {why}"
# The browser stopped answering at a step before the payment.
browser_lost = "Nothing was paid: the browser the DeepSeek top-up pays in stopped answering at {what}, before the payment."
# A step's page or control did not show as the tool finds it.
page_unread = "Nothing was paid: DeepSeek's platform did not show {what} within {seconds} seconds, so the tool stopped there, before the payment."
# DeepSeek asks a person to finish the sign-in.
person_asked = "Nothing was paid: DeepSeek asks a person to finish signing in, with a human check, or with a check of the account no mail from DeepSeek approved in time, which the tool does not do otherwise. The owner signs in to DeepSeek at {address} in his own Firefox at this machine's desktop, closes Firefox, and then the top-up is asked again."
# DeepSeek refused the login.
sign_in_refused = "Nothing was paid: DeepSeek refused the sign-in with the login saved as {secret}: save it again in the kind {kind} with the account's sign-in and password, then call again."
# DeepSeek asks for the account's identity verification.
identity_asked = "Nothing was paid: DeepSeek asks for the account's identity verification before it takes a payment, which only a person gives on its platform at {address}."
# The payment was refused.
refused = "Nothing was paid: DeepSeek or the card's issuer refused the payment, and the tool tries no payment again on its own. A person checks DeepSeek's billing page before asking for another top-up."
# The payment showed no outcome within the wait, a confirmation asked of a person included.
unconfirmed = "Nothing was paid that the platform confirmed within {seconds} seconds: where the card's issuer asks to confirm the payment, a person approves it in the card's app or with the code it sends, while the top-up waits. The tool stopped at the payment and tries none again on its own; a person checks DeepSeek's billing page before asking for another top-up."
# The amount paid and the balance after, as the balance reader read it.
outcome = "Paid: {paid} {currency}. Balance: {balance} {currency}, as the balance reader last read it at {seen}."
# The balance reader has not read the balance since the payment.
balance_stale = "The balance reader has not read the balance since the payment, so the balance above is the one before it."

# The media its models read natively (docs/provider-order.md, 「The media a model reads」): none.
# DeepSeek's models answer from words alone, so no rule stands here and its records carry no `reads`.
