# What an agent place's records are read for before a line is written (docs/agent-control.md, 「A record
# holds no secret」): which saved values count as a secret's.

# The words a saved value's key ends in, alone or after `api`, where the value is a secret's: the key's last
# part, split at `_`, `.` and `-` and read in any case.
secret_words = ["key", "token", "secret", "password", "passwd", "pass", "pwd", "credential", "credentials", "cookie"]

# The fewest characters a saved value counts at: a shorter run is an ordinary word.
least_characters = 12

# The bounds of the walk through the saved values, read once by each process that writes a record, a hook's call
# among them: a larger file is no saved secret's and is passed over, and the walk stops at the count of files.
saved_file_most_bytes = 65536
saved_files_most = 1000
