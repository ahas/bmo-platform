# The model gateway's front (docs/own-llm.md, 「The gateway」, 「A streamed answer whose bytes stop is cut」):
# how long a streamed answer may send no byte, from its headers on, before the front cuts it as broken. It
# outlasts a reasoning model's silent prefix at a long prompt, since the engines stream their reasoning.
stall_seconds = 180
# How long a run whose card was granted waits for the gateway to serve that card's entry, in seconds, before
# it gives up saying so: the launcher takes a standing instance into a new table on its beat, and a new table
# answers once its child has started (docs/own-llm.md, 「An engine the arbiter stands」).
serve_seconds = 600
