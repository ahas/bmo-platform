# What a job worker may be (docs/worker-slots.md), read by every process that adds or changes one.

# What a worker may be called. The name stands in a URL, in a systemd unit's name and in a lock file's,
# so it is the small alphabet all three take without quoting.
name_pattern = "^[a-z0-9][a-z0-9._-]{1,31}$"

# How long, in characters, the name a screen shows a worker under may be.
label_most = 40

# How much may be written in a worker's preamble, which stands at the front of every job prompt that
# worker is handed, so it is bounded the way a note is rather than the way a document is.
preamble_most = 8000

# How long the one line a worker's dev server is started with may be.
dev_command_most = 1000

# How many support workers one base may have beside it where its count is a number; `auto` sets none.
support_most = 8

# How long a support checkout of a repository set to `auto` stands idle, nothing holding it and no
# assignment of it changing, before it is taken away, in hours.
support_idle_hours = 6

# The first support worker's number: the base is the first of its repository.
first_support_slot = 2

# How many checkouts one job may hold at once, its own and those lent to it (docs/worker-slots.md, 「A
# checkout lent to a job」). Every loan keeps that repository's checkout from the queue for as long as the job
# runs, so the bound keeps one job from holding the machine's queues; it is set to hold the largest change
# that reaches many repositories at once, a base library's release carried to every consumer.
job_checkouts_most = 20

# How often, in seconds, a launch or a borrowing waiting for a checkout to lend looks again where no change of
# a job or an assignment woke it first: a hold some reads release without a word, such as a session's end.
loan_look_seconds = 5

# How long, in seconds, a borrowing that waits holds its ask before it answers that it still waits, for the
# verb to say so and ask again: under the minute the call clock lets a quiet call stand.
borrow_wait_seconds = 50

# How long, in seconds, a loan's give-back stands begun before another read takes it up again, as one a
# stop of agency cut short: well past the few seconds a park's commit and switch take.
loan_return_seconds = 600

# The message of the commit that parks what a job left open in a checkout lent to it, on the job's branch,
# with `{checkout}` the checkout and `{branch}` the branch.
park_message = "Park what was left open in {checkout} on {branch}"
