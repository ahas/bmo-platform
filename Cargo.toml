# The workspace: the crates agency is built from under `crates/`, the tools it provides under `tools/`, and
# the repository's own package at the root, which publishes nothing and holds every test in `tests/`. The
# version is the repository's one version, in semver: the major moves on a change to the boundary API or to
# a table's contract.
[workspace]
members = [
  "crates/client",
  "crates/agent-session",
  "crates/herdr",
  "crates/agent-host",
  "crates/pane-head",
  "crates/harness-machine",
  "crates/harness-providers",
  "crates/node-link",
  "crates/llm-gateway",
  "crates/policy",
  "crates/store",
  "crates/tool-call",
  "crates/cache-siren",
  "crates/server",
  "tools/app_put",
  "tools/deepseek_top_up",
  "tools/jobs",
  "tools/procedures",
  "tools/relay",
  "tools/skill_put",
  "tools/worker_ask",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.81"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bmo-agency-client = { path = "crates/client" }
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.12.1"
bmo-brain-client = { path = "../brain/crates/client" }
bmo-cache-warmer-schedule = { path = "../cache-warmer/schedule" }
bmo-chat = { path = "../../base/chat/provider" }
bmo-secret-shapes = { path = "../../base/chat/secret-shapes" }
bmo-gate-client = { path = "../gate/crates/client" }
bmo-node-client = { path = "../node/crates/client" }
bmo-pocket-client = { path = "../pocket/client" }
bmo-testbed-client = { path = "../testbed/client", default-features = false }
brush-parser = "0.4.0"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
diffy = "0.5.2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
glob = "0.3.4"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
inventory = "0.3.20"
libc = "0.2.177"
matchit = "0.8.4"
percent-encoding = "2.3.2"
procfs = { version = "0.18.0", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.11.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.0.4"
rev_lines = "0.3.0"
# Reads Firefox's profiles.ini, the list of the owner's Firefox profiles (the DeepSeek top-up, docs/tools.md).
rust-ini = "0.21.3"
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
# The OpenAPI document keeps its keys in the order the code writes them.
serde_json = { version = "1.0.138", features = ["preserve_order"] }
serde_norway = "0.9.42"
shlex = "2.0.1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "runtime-tokio"] }
sse-stream = "0.2.6"
strip-ansi-escapes = "0.2.1"
tempfile = "3.20.0"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
# The WebSocket WebDriver BiDi is carried on, to the owner's Firefox (the DeepSeek top-up, docs/tools.md).
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.19", features = ["io"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[package]
name = "agency-checks"
description = "The repository's tests: each crate's behaviour and the checks that span the repository."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs, with a module per crate's tests and per repository check
# (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false
autobins = false

# The package's library is empty. It stands so the test target's dev-dependency on this package can turn on
# `test-binaries`: Cargo turns a feature on through a dependency only where the package depended on has a
# library.
[lib]
path = "tests/package.rs"
doc = false
test = false

[[test]]
name = "main"
path = "tests/main.rs"

# The workspace binaries the tests start, each compiled from its crate's own entry point under a name of its
# own, so no build of the crate itself overwrites the copy a test binary was built against. Cargo builds a
# package's binaries before its integration tests and names each one's path to them, so no test runs Cargo.
# They need `test-binaries`, which only the test target's dev-dependency turns on, so a build of the
# workspace for a release builds none of them.
[features]
test-binaries = [
  "dep:agency-server",
  "dep:agent-host",
  "dep:axum",
  "dep:bmo-agency-client",
  "dep:clap",
  "dep:harness-machine",
  "dep:harness-providers",
  "dep:herdr",
  "dep:llm-gateway",
  "dep:node-link",
  "dep:policy",
  "dep:procedures-tool",
  "dep:rmcp",
  "dep:serde_json",
  "dep:sqlx",
  "dep:store",
  "dep:tokio",
  "dep:tool-call",
]

[[bin]]
name = "test-agency-server"
path = "crates/server/src/bin/agency-server.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-bmo-agency"
path = "crates/server/src/bin/bmo-agency.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-agent-host"
path = "crates/agent-host/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-pane-head"
path = "crates/pane-head/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-node-link"
path = "crates/node-link/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-llm-gateway"
path = "crates/llm-gateway/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-harness-providers"
path = "crates/harness-providers/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

[[bin]]
name = "test-procedures-tool"
path = "tools/procedures/src/main.rs"
required-features = ["test-binaries"]
test = false
doc = false

# What the test binaries are compiled against, present only where `test-binaries` is on.
[dependencies]
agency-server = { path = "crates/server", optional = true }
agent-host = { path = "crates/agent-host", optional = true }
axum = { workspace = true, optional = true }
bmo-agency-client = { path = "crates/client", optional = true }
clap = { workspace = true, optional = true }
harness-machine = { path = "crates/harness-machine", optional = true }
harness-providers = { path = "crates/harness-providers", optional = true }
herdr = { path = "crates/herdr", optional = true }
llm-gateway = { path = "crates/llm-gateway", optional = true }
node-link = { path = "crates/node-link", optional = true }
policy = { path = "crates/policy", optional = true }
procedures-tool = { path = "tools/procedures", optional = true }
rmcp = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
store = { path = "crates/store", optional = true }
tokio = { workspace = true, optional = true }
tool-call = { path = "crates/tool-call", optional = true }

[dev-dependencies]
agency-checks = { path = ".", features = ["test-binaries"] }
agency-server = { path = "crates/server" }
bmo-agency-client = { path = "crates/client" }
bmo-gate-client.workspace = true
agent-host = { path = "crates/agent-host" }
agent-session = { path = "crates/agent-session" }
cache-siren = { path = "crates/cache-siren" }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
harness-machine = { path = "crates/harness-machine" }
harness-providers = { path = "crates/harness-providers" }
herdr = { path = "crates/herdr" }
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
indexmap.workspace = true
libc.workspace = true
llm-gateway = { path = "crates/llm-gateway" }
node-link = { path = "crates/node-link" }
policy = { path = "crates/policy" }
procfs.workspace = true
app-put-tool = { path = "tools/app_put" }
skill-put-tool = { path = "tools/skill_put" }
deepseek-top-up-tool = { path = "tools/deepseek_top_up" }
jobs-tool = { path = "tools/jobs" }
procedures-tool = { path = "tools/procedures" }
relay-tool = { path = "tools/relay" }
worker-ask-tool = { path = "tools/worker_ask" }
regex.workspace = true
reqwest.workspace = true
schemars.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
sqlx.workspace = true
sse-stream.workspace = true
store = { path = "crates/store" }
tempfile.workspace = true
tokio.workspace = true
tool-call = { path = "crates/tool-call" }
toml.workspace = true

# The build profiles bmo-chat's docs/conventions.md, 「Rust builds」, states, which the cargo-profile quick
# check holds: debug information down to line numbers in a development build, none in a test binary, whose
# panics still name their file and line, and no incremental state, since every checkout's crates build
# under names of their own in the one shared build directory.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
