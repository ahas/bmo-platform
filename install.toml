# What installing the platform on a fresh machine needs, read by the testbed's install verb (bmo-testbed's
# docs/install.md, 「The install declaration」). The account service, the console, the agency server, the agent
# host and the model gateway stand in this one repository's deploy tree. The server settings and the console's
# environment stand under the data root (docs/web.md, 「Running as a service」; docs/api.md, 「Settings」); every
# unit the console calls adds its own address and token lines to the console's environment in its own
# declaration, so the environment written here holds the console's own keys alone.

install = 1

# The account server, the console, the agency server, the agent host and the model gateway, each a user unit of
# the deploy tree.
restart = "systemctl --user restart bmo-web-server.service bmo-web.service bmo-agency.service bmo-agent-host.service bmo-llm-gateway.service"

report = "{{input.web.public-address}}"

[[needs]]
program = "claude"
what = "Claude Code, the program every agent the platform runs is, signed in once by a person: install it with `curl -fsSL https://claude.ai/install.sh | bash`, then run `claude` and sign in."

# herdr, the terminal server every agent's pane stands in (https://github.com/herdrdev/herdr, Apache-2.0), at the
# release it runs, built from its repository where it is missing and placed as the one binary herdr.service runs.
[[needs]]
check = 'test -x "$HOME/.local/bin/herdr"'
what = "herdr, the terminal server every agent's pane stands in, as the one binary ~/.local/bin/herdr: the install builds it from https://github.com/herdrdev/herdr at v0.9.3, which needs Zig 0.16.0 on the PATH (https://ziglang.org/download/) besides Rust's rustup, which fetches the toolchain the repository pins."

[needs.source]
name = "herdr"
repository = "https://github.com/herdrdev/herdr.git"
rev = "v0.9.3"
build = '''
set -eu
zig="${ZIG:-zig}"
if ! "$zig" version 2> /dev/null | grep -qx '0.16.0'; then
  echo "herdr's build needs Zig 0.16.0 on the PATH, or ZIG naming one (https://ziglang.org/download/)" >&2
  exit 1
fi
cargo build --release --locked --bin herdr
install -D -m 755 target/release/herdr "$HOME/.local/bin/herdr"
'''

[[needs]]
check = 'PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin" command -v litellm'
what = "LiteLLM's proxy, which the model gateway runs as its child, on the gateway's own PATH: `uv tool install 'litellm[proxy]'` or `pipx install 'litellm[proxy]'`."

[[needs]]
program = "cargo"
what = "Rust's Cargo, which a deployment builds the servers and the skills placer with: `curl https://sh.rustup.rs -sSf | sh`."

[[needs]]
program = "cc"
what = "A C toolchain, whose linker Cargo links the servers with: the `build-essential` package."

[[needs]]
check = 'test -x "$HOME/.bun/bin/bun"'
what = "Bun at ~/.bun/bin/bun, which installs and runs the TypeScript packages, builds the console, runs it as a service and runs its account script: `curl -fsSL https://bun.sh/install | bash`."

[[needs]]
program = "git"
what = "git, which the deployment, the jobs' checkouts and a release's name run with: the `git` package."

[[needs]]
program = "rsync"
what = "rsync, which copies a release and a work node's tree: the `rsync` package."

[[needs]]
program = "systemd-run"
what = "systemd-run, which starts a run or a deployment in a user unit of its own: part of systemd."

[[needs]]
program = "pg_isready"
what = "PostgreSQL, the server the stores stand on, reached on its local socket by the user the install runs as: the `postgresql` package."

[[needs]]
check = '''psql --dbname=postgres --no-psqlrc --tuples-only --no-align --command "select 1 from pg_available_extensions where name = 'uuid-ossp'" | grep -qx 1'''
what = "PostgreSQL's contributed extensions, whose uuid-ossp the account service's migrations make in its database: the `postgresql-contrib` package."

[[needs]]
check = '{ valkey-cli ping || redis-cli ping; } 2>/dev/null | grep -qx PONG'
what = "Valkey (or Redis) answering on 127.0.0.1:6379, where the account service keeps its sign-in sessions: the `valkey` package (or `redis-server`), its service enabled."

[[needs]]
program = "curl"
what = "curl, which the after-steps call the servers' routes with: the `curl` package."

[[needs]]
program = "jq"
what = "jq, which the after-steps write and read JSON with: the `jq` package."

[[port]]
name = "agency.control"
number = 3220

[[port]]
name = "agency.quota"
number = 9200

# The model gateway's front, which listens on its own fixed port.
[[port]]
name = "agency.gateway"
number = 18030

[[port]]
name = "web.server"
number = 3240

[[port]]
name = "web.console"
number = 3210

# The control token every caller of the agency presents; also kept as its own file for the units that read it
# there.
[[token]]
name = "agency.control"
file = "env/agency.token"

# The gateway's own key, the one door every request passes; the gateway reads it from this file alone.
[[token]]
name = "agency.gateway"
file = "env/llm-gateway.key"

# The bearer every caller of the account service presents (docs/accounts.md, 「Where it answers」).
[[token]]
name = "web.server"
file = "env/web.token"

# The key the console seals its session cookie with, at least 32 characters.
[[token]]
name = "web.session"
file = "env/web-session.key"

# The first chat agent: its registration name and the label a room calls it by.
[[value]]
name = "agent.name"
value = "bmo"

[[value]]
name = "agent.label"
value = "BMO"

# The account key the administrator's agents' brains are filed under: the console's first account, the owner's.
[[value]]
name = "agency.brain-account"
value = "1"

# Where the other units reach the account service.
[[value]]
name = "web.address"
value = "http://127.0.0.1:{{port.web.server}}"

# The owner's user on the account service: the data move makes the console's one account the first user of a
# fresh database (docs/accounts.md, 「The data move」), and user ids count from 1.
[[value]]
name = "web.owner-account"
value = "1"

[[input]]
name = "web.owner-name"
what = "The name the owner signs in to the console with: 2 to 64 letters, digits, dots, underscores and hyphens, chosen by the person installing."
file = "install/inputs/web.owner-name"

[[input]]
name = "web.owner-password"
what = "The password the owner signs in to the console with, 8 characters or more, chosen by the person installing."
file = "env/web-owner-password"
secret = true

[[input]]
name = "web.public-address"
what = "The console's public address as a browser opens it, its scheme, host and the base path /bmo/ with its closing slash, such as https://console.example/bmo/; the machine's own address where nothing outside reaches it."
file = "install/inputs/web.public-address"
default = "http://127.0.0.1:{{port.web.console}}/bmo/"

[[database]]
name = "bmo_agency"

[[database]]
name = "bmo_web"

# The account service's settings.local.toml (docs/boundary.md, 「Settings」).
[[settings]]
file = "env/web.toml"
text = '''
[server]
listen = "127.0.0.1:{{port.web.server}}"
token = "{{token.web.server}}"

[database]
url = "postgres:///bmo_web?host={{postgres.host}}&port={{postgres.port}}"

[sessions]
valkey = "{{valkey.url}}/13"

[receiver]
base = "http://127.0.0.1:{{port.receiver.server}}"
token = "{{token.receiver.service}}"

[agency]
base = "http://127.0.0.1:{{port.agency.control}}"
token = "{{token.agency.control}}"

[names]
chat_agent = "{{value.agent.label}}"

[secrets]
dir = "{{data_root}}/env"
'''

# The console's own environment (client/apps/web/.env.example), which its unit and its build read. The control
# socket is not among them: it stands under the user's runtime directory, which no value here names, and the
# tool-socket after-step adds it.
[[settings]]
file = "env/web-console.env"
text = '''
PORT={{port.web.console}}
BMO_WEB_BASE_URL=/bmo/
NUXT_SESSION_PASSWORD={{token.web.session}}
WEB_DATABASE_URL=postgres:///bmo_web?host={{postgres.host}}&port={{postgres.port}}
WEB_SERVER_ADDRESS={{value.web.address}}
WEB_SERVER_TOKEN={{token.web.server}}
NUXT_PUBLIC_CHAT_AGENT_NAME={{value.agent.name}}
NUXT_PUBLIC_CHAT_AGENT_LABEL={{value.agent.label}}
NUXT_PUBLIC_CONSOLE_ADDRESS={{input.web.public-address}}
WEB_DATA_DIR={{data_root}}/web
WEB_FEATURES_FILE={{data_root}}/env/console-features.toml
POCKET_SESSION_TOKEN_FILE={{data_root}}/tool-host/held/console.token
KEEPALIVE_CONSUMER=receiver
BMO_WEB_SERVER_BIN={{prefix}}/bmo-agency/deploy/bin/bmo-web-server
BMO_WEB_SERVER_DIR={{prefix}}/bmo-agency/deploy/server
DEPLOY_ROOTS={{prefix}}/bmo-cli:{{prefix}}/bmo-pocket:{{prefix}}/bmo-testbed:{{prefix}}/bmo-job:{{prefix}}/bmo-brain:{{prefix}}/bmo-cache-warmer:{{prefix}}/bmo-agency:{{prefix}}/bmo-receiver:{{prefix}}/bmo-gate:{{prefix}}/bmo-explorer:{{prefix}}/bmo-telegram:{{prefix}}/bmo-discord:{{prefix}}/bmo-artifact:{{prefix}}/bmo-note:{{prefix}}/bmo-calendar:{{prefix}}/bmo-drive:{{prefix}}/bmo-mail:{{prefix}}/bmo-remote:{{prefix}}/bmo-review:{{prefix}}/bmo-research:{{prefix}}/bmo-node:{{prefix}}/bmo-arbiter:{{prefix}}/bmo-voice:{{prefix}}/bmo-eye:{{prefix}}/bmo-face:{{prefix}}/bmo-voc:{{prefix}}/bmo-cache-siren:{{prefix}}/bmo-theater:{{prefix}}/jake-hub
'''

# The account service's address and token for the units that ask it and read them from this file, the agency
# part among them.
[[settings]]
file = "env/web.env"
text = '''
WEB_ADDRESS={{value.web.address}}
WEB_TOKEN={{token.web.server}}
'''

# The console's held session on the tool host (bmo-pocket's docs/api.md, 「A console's tool session」): the two
# explorer entries a link card's page and picture are read through, and no other (docs/boundary.md, 「The web
# beyond the units」). The host issues it and writes its token beside it, the file
# POCKET_SESSION_TOKEN_FILE names.
[[settings]]
file = "tool-host/held/console.json"
text = '''
{
  "holderName": "console",
  "namespaces": ["explorer"],
  "capabilities": [],
  "grants": [],
  "entries": ["explorer/link_preview", "explorer/fetch_raster"],
  "variables": { "BMO_DATA_DIR": "{{data_root}}" }
}
'''

# The agency server's settings (docs/api.md, 「The control port」 and 「Calls agency makes」; docs/policy.md,
# 「The deployment's names」), which the gateway and the agency's verbs read as well.
[[settings]]
file = "env/agency.env"
text = '''
AGENCY_CONTROL_PORT={{port.agency.control}}
AGENCY_CONTROL_TOKEN={{token.agency.control}}
AGENCY_QUOTA_PORT={{port.agency.quota}}
BMO_DATA_DIR={{data_root}}
BMO_ARCHIVE_URL=postgres:///bmo_agency?host={{postgres.host}}&port={{postgres.port}}
AGENCY_AGENT_KEY={{value.agent.name}}
AGENCY_AGENT_NAME={{value.agent.label}}
AGENCY_SENDER_NAME={{value.agent.label}}
AGENCY_OWNER_NAME={{input.web.owner-name}}
AGENCY_BRAIN_URL=http://127.0.0.1:{{port.brain.server}}
AGENCY_BRAIN_TOKEN={{token.brain.service}}
AGENCY_BRAIN_ACCOUNT={{value.agency.brain-account}}
AGENCY_PERSONA_VALUES={{data_root}}/env/persona.toml
BMO_JOB_URL=http://127.0.0.1:{{port.job.server}}
BMO_JOB_TOKEN={{token.job.agency}}
BMO_JOB_PLUGIN={{prefix}}/bmo-job/deploy/bin/bmo-job
BMO_AGENCY_URL=http://127.0.0.1:{{port.agency.control}}
BMO_MCP_HOST_PORT={{port.pocket.tools}}
BMO_GATE_URL=http://127.0.0.1:{{port.gate.server}}
BMO_GATE_TOKEN_FILE={{data_root}}/env/gate.token
BMO_RECEIVER_URL=http://127.0.0.1:{{port.receiver.server}}
BMO_RECEIVER_TOKEN_FILE={{data_root}}/env/receiver.token
BMO_ARTIFACT_URL=http://127.0.0.1:{{port.artifact.server}}
BMO_ARTIFACT_TOKEN_FILE={{data_root}}/env/artifact.token
BMO_EXPLORER_PLUGIN={{prefix}}/bmo-explorer/deploy/bin/bmo-explorer
BMO_CONSOLE_ADDRESS={{input.web.public-address}}
'''

# The console reaches the agency part on its control port, under the control token.
[[line]]
file = "env/web-console.env"
key = "AGENCY_ADDRESS"
value = "http://127.0.0.1:{{port.agency.control}}"

[[line]]
file = "env/web-console.env"
key = "AGENCY_TOKEN"
value = "{{token.agency.control}}"

# The first account, made by the console's account script (docs/web.md, 「Making an account and resetting a
# password」) from the deployment's build tree, where its packages stand installed. The script takes the name
# and the password as words, so they are put into its words inside the process from the input files and never
# stand on a command line. The console's environment file is exported a line at a time, each value verbatim:
# read by the shell as a script, a value holding `&`, as the database address does, would end its own
# assignment.
[[after]]
id = "first-account"
inputs = ["web.owner-name", "web.owner-password"]
run = '''
set -eu
while IFS= read -r line; do
  case "$line" in
    '' | '#'*) ;;
    *) export "$line" ;;
  esac
done < "$BMO_DATA_DIR/env/web-console.env"
cd "$BMO_INSTALL_PREFIX/bmo-agency/deploy-expand/client/apps/web"
"$HOME/.bun/bin/bun" -e '
const read = (name) => require("node:fs").readFileSync(process.env[name], "utf8").replace(/\r?\n$/, "");
process.argv.splice(1, process.argv.length - 1, "scripts/user.ts", "set", read("BMO_INPUT_WEB_OWNER_NAME"), read("BMO_INPUT_WEB_OWNER_PASSWORD"), "--administrator");
await import("./scripts/user.ts");
'
'''
done = '''psql --dbname=bmo_web --no-psqlrc --tuples-only --no-align --command "select 1 from web_users limit 1" | grep -qx 1'''

# The data move (docs/accounts.md, 「The data move」), which brings the account model into force and makes the
# console's one account the platform administrator. A fresh machine has no owner's sender and no room to carry:
# the console links the owner's sender to that account itself once the receiver names one.
[[after]]
id = "data-move"
run = '''
set -eu
env="$BMO_DATA_DIR/env/web-console.env"
field() { sed -n "s/^$1=//p" "$env" | tail -n 1; }
header="$(mktemp)"
trap 'rm -f "$header"' EXIT
printf 'Authorization: Bearer %s\n' "$(field WEB_SERVER_TOKEN)" > "$header"
printf '%s' '{"ownerSenders": [], "rooms": []}' |
  curl -sf -o /dev/null -H @"$header" -H 'Content-Type: application/json' --data-binary @- "$(field WEB_SERVER_ADDRESS)/accounts/move"
'''
done = '''
set -eu
env="$BMO_DATA_DIR/env/web-console.env"
field() { sed -n "s/^$1=//p" "$env" | tail -n 1; }
header="$(mktemp)"
trap 'rm -f "$header"' EXIT
printf 'Authorization: Bearer %s\n' "$(field WEB_SERVER_TOKEN)" > "$header"
curl -sf -H @"$header" "$(field WEB_SERVER_ADDRESS)/accounts/model" | jq -e '.inForce == true' > /dev/null
'''

# herdr's unit, which no deployment links (deploy/herdr.service): linked from the deploy tree and started once,
# then the agency server restarted so it stands its places in it.
[[after]]
id = "herdr"
run = '''
set -eu
systemctl --user enable --now "$BMO_INSTALL_PREFIX/bmo-agency/deploy/deploy/herdr.service"
systemctl --user restart bmo-agency.service
'''
done = "systemctl --user is-enabled --quiet herdr.service && systemctl --user is-active --quiet herdr.service"

# The first chat agent registered as a supervisor (docs/api.md, 「supervisors」), on Claude Code with the
# machine's own login; its brain is made with it. The name and label are read from the server's settings.
[[after]]
id = "first-chat-agent"
run = '''
set -eu
env="${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/env/agency.env"
field() { sed -n "s/^$1=//p" "$env" | tail -n 1; }
base="http://127.0.0.1:$(field AGENCY_CONTROL_PORT)"
header="$(mktemp)"
trap 'rm -f "$header"' EXIT
printf 'Authorization: Bearer %s\n' "$(field AGENCY_CONTROL_TOKEN)" > "$header"
tries=0
until curl -sf -o /dev/null -H @"$header" "$base/supervisors"; do
  tries=$((tries + 1))
  if [ "$tries" -ge 150 ]; then
    echo "the agency server's control port did not answer" >&2
    exit 1
  fi
  sleep 2
done
jq -n --arg name "$(field AGENCY_AGENT_KEY)" --arg label "$(field AGENCY_AGENT_NAME)" \
  '{name: $name, label: $label, provider: "claude-code", model: "claude-opus-5", effort: "high"}' |
  curl -sf -o /dev/null -H @"$header" -H 'Content-Type: application/json' --data-binary @- "$base/supervisors"
'''
done = '''
set -eu
env="${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/env/agency.env"
field() { sed -n "s/^$1=//p" "$env" | tail -n 1; }
header="$(mktemp)"
trap 'rm -f "$header"' EXIT
printf 'Authorization: Bearer %s\n' "$(field AGENCY_CONTROL_TOKEN)" > "$header"
curl -sf -o /dev/null -H @"$header" "http://127.0.0.1:$(field AGENCY_CONTROL_PORT)/supervisors/$(field AGENCY_AGENT_KEY)"
'''

# The first chat agent's starting lessons, written into its brain once and only where it holds no memory
# (docs/supervisors.md, 「A fresh brain's starting lessons」).
[[after]]
id = "first-lessons"
run = "sh deploy/first-lessons run"
done = "sh deploy/first-lessons done"

# The tool host's control socket, which stands under the user's runtime directory, added to the console's
# environment and the console restarted to read it.
[[after]]
id = "tool-socket"
run = '''
set -eu
env="$BMO_DATA_DIR/env/web-console.env"
printf 'BMO_MCP_HOST_SOCKET=%s\n' "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/bmo/mcp-host.sock" >> "$env"
systemctl --user restart bmo-web.service
'''
done = '''grep -q '^BMO_MCP_HOST_SOCKET=' "$BMO_DATA_DIR/env/web-console.env"'''

[[verify]]
id = "console-answers"
what = "the console answers at its own port under its base path"
run = '''
set -eu
port="$(sed -n 's/^PORT=//p' "$BMO_DATA_DIR/env/web-console.env" | tail -n 1)"
curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/bmo/" | grep -qE '^(2|3)[0-9][0-9]$'
'''

[[verify]]
id = "chat-agent-road"
what = "the first chat agent's road can take a turn now: Claude Code is installed and signed in"
run = '''
set -eu
env="${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/env/agency.env"
field() { sed -n "s/^$1=//p" "$env" | tail -n 1; }
header="$(mktemp)"
trap 'rm -f "$header"' EXIT
printf 'Authorization: Bearer %s\n' "$(field AGENCY_CONTROL_TOKEN)" > "$header"
road="$(curl -sf -H @"$header" "http://127.0.0.1:$(field AGENCY_CONTROL_PORT)/supervisors/$(field AGENCY_AGENT_KEY)/road")"
if ! printf '%s' "$road" | jq -e '.answers == true' > /dev/null; then
  printf '%s' "$road" | jq -r '.reason // "the road gave no reason"' >&2
  exit 1
fi
'''
