# What the memory verbs say of a row and refuse in its words (docs/memories.md, 「The tools and the script」):
# the line a listing shows a row by, the refusals naming the form a flag takes, and the event grammar's own
# refusals. Each `{name}` is filled in with what it names.

# The scope a global row is listed under, with the kinds of room it {reach}es.
global_scope: "전역 · {reach}"
# A row handed over as one strand of the 미결 of the TODO item {item}.
from_item: " · 항목 #{item}의 미결"

# A row taken down or raised with no reason given.
why_missing: "--why '<사유>' says why, and a row never comes down for no reason anybody can read"
# A row filed with no action.
action_missing: "--action '<무엇을>' is what attaches; give it, or --action - with the text on stdin"
# A state moved on with no text of where it now stands.
state_missing: "--action '<지금 어디까지>' is where the state now stands; give it, or --action - with the text on stdin"
# A situation row filed with neither a condition nor an event.
situation_unpaired: "a situation row is a pair: --condition '<언제>' is the half the matcher reads, or --on <event> the fact it waits for, and without either it would attach every turn"
# A situation row, named by {handle}, asked to be checked off; {slug} is what takes it down instead.
situation_unfinished: "memory '{handle}' is a situation row, which is never finished: take it down with --retire {slug} --why '<사유>'"

# An event written {given} that is no kind of the grammar; {kinds} lists the kinds, with the item where one
# takes it. An empty value is named as such.
event_unknown: "알 수 없는 사건입니다: {given}. {kinds} 가운데 하나를 쓰세요."
event_empty: "(빈 값)"
# How a kind that may name an item is written among the kinds.
event_kind_item: "{kind}[:<항목>]"
# An item put on an event {given} of the {kind} that names none.
event_takes_no_item: "{kind} 사건은 항목을 달지 않습니다: {given}"
# An event {given} whose item is no item number.
event_bad_item: "사건의 항목 번호가 올바르지 않습니다: {given}"

# The usage the verb answers a call it cannot read with, {verb} the command it is run as.
usage: |-
  usage: {verb} --chat <chatId>|--global [--reach <owner|group|all>] --add --type <promise|check|followup|situation|state> --action '<무엇을>'|- [--condition '<언제>' | --on <deployed[:<항목>]|job-ended[:<항목>]|queue-changed> | --until '<check>' [--name '<짧은 이름>'] [--every <seconds>] [--within <minutes>]] [--slug <slug>] [--for <userId>] [--by <userId>] [--message <messageId>] [--todo <itemId>] [--replaces <slug>]
         {verb} --chat <chatId> --update <id|slug> --action '<지금 어디까지>'|-
         {verb} --chat <chatId> --done <id|slug> [--text '<how it ended>']
         {verb} --chat <chatId>|--global --retire <id|slug> --why '<사유>'
         {verb} --chat <chatId>|--global --revive <id|slug>
         {verb} --chat <chatId>|--global --candidate <id|slug> --why '<사유>'
         {verb} --chat <chatId>|--global --list [--all] [--type <type>]
  every form takes --agent <name>, the agent whose rows these are, where the run calling it names none
