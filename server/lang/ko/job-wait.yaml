# What `bmo job wait` says where a job's mark on a long wait is asked for wrongly (docs/agent-control.md,
# 「A job's own mark on a long wait」): its usage, and the two refusals that name what a mark needs in
# the job's own words.

# The verb's three forms, printed under every refusal of its words.
usage: |-
  usage: bmo job wait --todo <id> --what '<무엇을 기다리나>' (--unit <유닛> | --pid <pid>) --until <40m|2h|14:30>
         bmo job wait --todo <id> --what '<무엇을 기다리나>' --until <40m|2h|14:30> -- <명령…>
         bmo job wait --todo <id> --clear

# A mark says what the job waits on.
what: "say what the job waits on: --what '<무엇을 기다리나>'."

# A mark names the one thing whose life says the wait goes on, or runs a command that is its own target.
target: "name the one thing whose life says the wait goes on: --unit <유닛> or --pid <pid>, or run the command after --."
