# What `bmo job tool-calls` says of a job's own thread, read out of the record the CLI keeps for its session
# (docs/jobs.md): which job and record were read, what the calls added up to, and each call longest
# first. Each `{name}` is filled in with what it names; a length of time is the span words' own.

# The item named has no job in the archive; {todo} is its number.
no_job: "항목 #{todo}의 Job이 아카이브에 없습니다."
# No worker runs in the checkout the verb was run from; {here} is that checkout.
no_worker: "{here}에서 실행되는 워커가 agents 표에 없습니다. --session으로 기록 파일을 직접 대 주세요."
# A record the worker holds, by its session and model.
session: "세션 {session} · {model}"
# No record could be read.
nothing_to_read: "읽을 기록이 없습니다. 세션이 쓸려 나가면 그 안쪽은 다시 볼 수 없고, Job이 남긴 시간과 토큰만 남습니다."
# The job read: {todo} the item, {job} the job's number.
job: "항목 #{todo} · Job {job}"
# Beside the job where the item was tried more than once; {runs} how many times.
last_of: " (실행 {runs}회 중 마지막)"
# Where the window has no end yet.
still_running: "아직 실행 중"
# The record read, and how many lines it holds.
record: "기록 {path}"
lines: "줄 {count}개"
# No call in the whole record, or none inside the job's window.
no_calls: "이 기록에는 툴 호출이 하나도 없습니다."
no_calls_in_window: "그 창 안에 이 기록의 툴 호출이 하나도 없습니다. Job이 다른 세션에서 실행됐거나, 그 세션이 쓸려 나간 뒤입니다."
# What the calls add up to: {times} calls, {span} their time added, {open} the unanswered ones' part.
total: "툴 {times}회 · 합계 {span}{open}"
open: " · 답 못 받은 것 {open}회"
# One tool's share.
tool: "{name} {span} {times}회"
# The suite's own calls, or where it was never called.
tests: "bun test {times}회 {span}"
no_tests: "bun test: 이 기록에서는 부른 적이 없습니다."
no_tests_in_window: "bun test: 이 창에서는 부른 적이 없습니다."
# The heading over the calls, all of them or the longest {top} of {all}.
order: "오래 걸린 순서"
order_top: "오래 걸린 순서로 {top}개 (전체 {all}회)"
# One call: {index} its place, {name} the tool, {span} how long it was out, {at} when it went out.
call: "{index}. {name} {span} · {at}{open}"
# Beside a call the record ends with still out.
call_open: " · 답 없음"
# A call whose record names no tool.
unnamed_tool: "이름 없는 툴"
