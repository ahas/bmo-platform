# What the accounts have been spending as `bmo usage` prints it (docs/usage.md): the last five hours and
# the last seven days, each by mode and model and by agent, and with `--refresh-claude` what each Claude
# account's own windows stand at. Each `{name}` is filled in with what it names.

# The two stretches read, newest first.
windows:
  five_hours: "최근 5시간"
  seven_days: "최근 7일"

# The two ways a stretch's rows are grouped, and what a grouping with no rows says, {title} its name.
groups:
  models: "모드·모델별"
  agents: "에이전트별"
  empty: "{title}: 기록 없음"

# The four kinds a run reports, as the console's usage view names them too: what it read, what it wrote,
# and the cache on both sides.
kinds:
  read: "읽기"
  write: "쓰기"
  cache_read: "캐시읽기"
  cache_write: "캐시쓰기"

# What went past whichever kinds it divided into, {tokens} the figure; how many runs a line counts,
# {runs} the count; and what the kinds cannot cover, the {runs} rows written before the split and the
# {tokens} they carry.
total: "총 {tokens}"
runs: "{runs}회"
unsplit: "분리 전 {runs}건 {tokens}"

# One Claude account's windows read afresh: why it could not be read, {title} the account and
# {failure} why; a window's reset moment as the owner reads it, in Korea's time, or that it has none.
refresh:
  unread: "{title}: 읽지 못함 ({failure})"
  resets: "{moment} KST 재설정"
  no_reset: "재설정 시각 없음"
  moment: "{month}. {day}. ({weekday}) {hour}:{minute}"
  # The weekdays, Sunday first.
  weekdays: ["일", "월", "화", "수", "목", "금", "토"]
