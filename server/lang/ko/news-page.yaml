# The morning news page and the message that hands it to a room (docs/news-brief.md, 「The page」), as
# `bmo runner news-brief` draws them. Each `{name}` is filled in with what it names.

# The weekdays from Sunday, as the day a page is for names its own.
weekdays: ["일", "월", "화", "수", "목", "금", "토"]
# The day a page is for: {year}, {month} and {date} without leading noughts, {weekday} one of the above.
spoken_day: "{year}년 {month}월 {date}일 ({weekday})"
# The page's title and the message's second line, {day} the day as said above.
title: "오늘의 뉴스 · {day}"
# The section headings, in the order the page carries them.
news: "주요 뉴스"
korea_market: "국내 증시"
us_market: "미국 증시"
real_estate: "국내 부동산"
# An index the page could read no close of.
no_close: "종가를 읽지 못했어요"
# The day an index's close is of, {date} as MM/DD.
close_of: "{date} 종가"
# What a chart is read out as: {name} the index, {first} and {last} the days it runs between, {count}
# how many closes it draws, {low} and {high} the lowest and the highest.
chart_label: "{name} {first}부터 {last}까지 {count}거래일 종가, 최저 {low} 최고 {high}"
# The link under a card to its article, {host} the outlet's address.
original: "{host} 원문"
# What stands before a section's links to its sources.
sources: "출처"
footer: "기사를 읽고 새로 요약 · 지수는 네이버 증권 종가"
# The indices by the key each is read under.
indices:
  KOSPI: "코스피"
  KOSDAQ: "코스닥"
  DJI: "다우존스"
  SPX: "S&P 500"
  NASDAQ: "나스닥 종합"
# The account of a morning that did not go out, written into the fact the chat agent is told: {day} the day, {chat}
# the room, {reason} what failed.
failed: "{day} 아침 뉴스 페이지를 만들지 못해 {chat} 방에 보내지 못했다. 사유: {reason}. 기록: journalctl --user -u 'bmo-news-brief-*'"
