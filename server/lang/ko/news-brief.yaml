# The morning news pages as `bmo news-brief` shows them (docs/news-brief.md, 「The verb」): one line to a
# room, and the holiday calendar's count beneath. Each `{name}` is filled in with what it names.

# Whether a room's page goes out.
on: "켜짐"
off: "꺼짐"
# One room's row: {id} its number, {state} on or off, {room} the room, {at} the Seoul time it is sent,
# {lead} the minutes before that the writing starts, {share} the hours its link lives, {last} the day a
# page last started for it.
line: "#{id} {state} · {room} · 평일 {at} ({lead}분 전 작성 시작) · 공유 {share}시간 · 마지막 {last}"
# What {last} reads before any page started.
never: "없음"
# A room the archive kept a title for: {title} the title, {chat} its number.
titled_room: "{title} ({chat})"
# A row taken off the list, {line} the row as it stood.
removed: "{line}: 지움"
# No room gets the page.
no_rooms: "아침 뉴스를 받는 방이 없어요"
# The calendar's count beneath the rooms: {count} days in {year}, {next_count} in {next}.
holiday_count: "{year}년 공휴일 {count}일 · {next}년 {next_count}일"
# A day added, {day} the day and {name} its name, and a day taken off.
holiday_added: "{day} {name}: 넣음"
holiday_removed: "{day}: 뺌"
