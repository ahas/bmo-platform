# What a work order holding its checkout says (docs/work-orders.md, 「A stopped work order's turn」 and
# 「Measuring a stage that has not produced a result」): what keeps it waiting to let go, where it stands
# in its worker's line, what it writes down of the change it leaves behind, and what it says where git
# refused it; the commit messages it writes that change under are English and stand in the shared policy
# (`hold-commits.toml`). The bun bot and `bmo-server` say them alike where each runs the order. Each `{name}` is filled in with what it names: {item} the order's TODO item, {worker} the
# worker whose checkout it is.

# What a stopped order waits on before it lets its checkout go: an open {job}, a lock with nothing behind
# it, ended {units} still alive or one {unit} whose run record {id} with its {label} is not closed ({more}
# such records), its own turns still {live}, or the check run over its {count} changed files for the
# {starts}th time.
waits:
  open_job: "{worker} 워커의 Job #{job}이 아직 열려 있어요"
  lock: "체크아웃의 Job 잠금이 잡혀 있어요"
  ended_units: "{worker} 워커의 끝난 Job 유닛 {units}이 아직 살아 있어요"
  ended_record: "{worker} 워커의 끝난 Job 유닛 {unit}의 실행 기록 {id}({label})이 닫히지 않았어요{more}"
  ended_records: " · 이런 기록이 {count}개예요"
  own_turns: "멈추기 전 제 턴 {live}이 아직 살아 있어요"
  checking: "제 변경 파일 {count}개로 저장소 검사를 실행하는 중이에요 ({starts}번째 검사)"
  release: "체크아웃을 놓을 차례를 기다리는 중"

# Where a stopped order stands in its worker's line, with why and the {failures} counted against it, and
# the reason the owner's stop gave it ({owner}, {why}).
place:
  line: "{turn}: {why}{failures}"
  failures: " · 실패 {failures}번"
  resume: "재개할 차례"
  passed: "차례를 넘기는 중"
  held: "보류"
  owner_stop: "{owner}가 중지: {why}"

# What the order writes down of the change it leaves: a check that kept being restarted ({tries} starts),
# a commit it could not push ({commit}, {refused}), a change it could not take into a commit ({why}),
# paths it could not part from others' ({paths}), a change parked on a {branch} ({count} files at
# {commit}), and a checkout it could not take back to its {main} branch ({said}).
notes:
  unsettled: "검사하는 사이 변경이 계속 바뀌어 검사를 {tries}번 시작한 뒤 그만두고, 제 변경을 main 밖 wip/{item} 브랜치에 둡니다."
  unpushed: "멈춘 지시서의 변경을 커밋 {commit}로 두었지만 푸시하지 못했습니다: {refused}"
  uncommitted: "멈춘 지시서의 변경을 커밋으로 거두지 못해 체크아웃에 그대로 둡니다: {why}"
  left: "남의 변경과 갈라낼 수 없어 체크아웃에 남긴 변경: {paths}"
  parked: "지시서의 변경 {count}개를 {branch} 브랜치에 커밋 {commit}로 두었습니다."
  parked_stopped: "멈춘 지시서의 변경 {count}개를 {branch} 브랜치에 커밋 {commit}로 두었습니다."
  not_parked: "멈춘 지시서의 변경을 브랜치에 거두지 못해 작업 경로에 그대로 둡니다: {why}"
  not_on_main: "기본 체크아웃을 {main}으로 돌려놓지 못해 지시서의 브랜치에 그대로 둡니다: {said}"
  unread: "원인을 읽지 못함"

# Where taking the checkout onto the order's branch, or taking a parked change back, failed: the {place}
# it could not move with {why}, a {branch} that is not there or would not come back ({said}), and each git
# step that went wrong.
git:
  own_worktree: "{worker}의 작업 경로"
  base_checkout: "기본 체크아웃"
  not_moved: "{place}를 지시서의 브랜치에 올리지 못해 멈춥니다: {why}"
  not_merged: "멈출 때 브랜치에 둔 변경을 가져오지 못해 다시 멈춥니다: {why}"
  no_branch: "브랜치 {branch}가 없습니다."
  not_fetched: "브랜치 {branch}를 가져오지 못했습니다: {said}"
  add: "변경을 커밋에 올리지 못했습니다"
  commit: "변경을 커밋하지 못했습니다"
  read_commit: "커밋을 읽지 못했습니다"
  read_head: "HEAD를 읽지 못했습니다"
  write_tree: "트리를 쓰지 못했습니다"
  write_commit: "커밋을 쓰지 못했습니다"
  move_branch: "브랜치를 옮기지 못했습니다"
  take_back: "변경을 걷어 내지 못했습니다"
  read_branch: "브랜치의 변경을 읽지 못했습니다"
