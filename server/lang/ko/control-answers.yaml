# A gate's options: a {key} that is no gate or may not be turned off, the values a change may carry and
# their bounds ({least} to {most} seconds, the Laya {modes}, the {fallback} word for no stand-in), and a
# Laya {mode} a gate cannot take.
gates:
  not_gate: "게이트가 아닙니다: {key}"
  own_llm: "게이트의 생각과 출력 크기는 모델 등급의 자체 LLM 설정에서 정합니다."
  nothing: "바꿀 값이 없습니다: 제한시간, Laya 모드, τ, 사용, Laya 대체 LLM 가운데 하나를 보내 주세요."
  fallback: "Laya 대체 LLM은 공급자 이름이나 {fallback}여야 합니다."
  switch: "사용은 켬(true)이나 끔(false)이어야 합니다."
  always_on: "이 게이트는 끌 수 없습니다: {key}"
  timeout: "제한시간은 {least}초에서 {most}초 사이여야 합니다."
  mode: "Laya 모드는 {modes} 가운데 하나여야 합니다."
  tau: "τ는 0에서 1 사이의 숫자여야 합니다."
  no_question: "이 게이트에는 Laya 질문이 없어 off 말고는 둘 수 없습니다: {key}"
  no_safety: "이 게이트에는 안전 판정이 없어 비대칭 모드로 둘 수 없습니다: {key}"
  no_checkpoint: "Laya 서버에 이 게이트의 체크포인트가 없어 {mode} 모드로 켜지 않았습니다. 마지막 상태 확인이 이 게이트를 말하지 않습니다: {key}"
  needs_tau: "{mode} 모드에는 τ가 있어야 합니다."
# A worker brought back to this machine with no path of this machine, and a worker's own sampling: an
# {agent} not known, one whose {label} is no worker's or a support worker's that follows its base, a save that
# is not names with values, and a setting {name} the sampling does not take.
workers:
  back_here_path: "이 기기로 돌아올 때는 이 기기의 경로를 입력해 주세요."
  sampling:
    no_agent: "에이전트를 찾을 수 없습니다: {agent}"
    not_worker: "{label}은(는) 워커가 아니어서 샘플링을 따로 두지 않습니다."
    follows_base: "{label}의 샘플링은 기본 워커의 설정을 따릅니다."
    shape: "샘플링은 이름과 값의 짝이어야 합니다."
    unknown: "샘플링에 {name} 설정은 없습니다."

laya:

  # A Laya mode as a sentence or the console names it.
  modes:
    off: "꺼짐"
    shadow: "그림자"
    filter: "필터"
    asymmetric: "비대칭"

  # How the Laya server last answered, as the console shows it.
  states:
    up: "응답함"
    off: "주소 없음"
    unknown: "확인 전"
    unreachable: "닿지 않음"
    timeout: "응답 없음"
    refused: "거부됨"
    bad-answer: "잘못된 답"
    too-large: "너무 큼"
