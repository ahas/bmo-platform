# What the control port's routes answer the console with where they refuse a change (docs/control-port.md,
# 「How a request is answered」), said alike by the bun bot's routes and `bmo-server`'s where each answers
# them, and the words the console shows of Laya. Each `{name}` is filled in with what it names.

# A request no route can read.
request:
  not_json: "요청 본문이 JSON이 아닙니다."
  action: "요청한 동작이 올바르지 않습니다."

# The fallback roads and the run modes: a work key no provider can answer ({key} unknown to the routes),
# a {provider} model list that could not be had for {why}, the provider order and switches, and the
# model settings retired for the tiers.
fallback:
  no_laya: "Laya에 물을 수 없어 이 게이트는 기본값으로만 보냅니다. BMO_LAYA_URL을 확인해 주세요."
  no_provider: "이 작업 키에 답할 수 있는 켜진 공급자가 없습니다. 공급자 설치·키·모델 설정을 확인해 주세요."
  models_unread: "{provider} 모델 목록을 받지 못했습니다: {why}"
  unknown_key: "알 수 없는 fallback key입니다: {key}"
  models_retired: "개별 모델 설정은 종료되었습니다. 모델 등급 설정을 사용해 주세요."
  order: "순서는 {providers}를 한 번씩 담아야 합니다."
  provider_switch: "공급자 이름과 켬·끔 값이 필요합니다."
  run_mode: "실행 모드는 자동 또는 공급자 하나여야 합니다."
  tier_provider: "공급자를 선택해 주세요."

