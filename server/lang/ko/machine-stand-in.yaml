# What `bmo machine stand-in` says (docs/rust-migration.md, 「The target」): its usage, a line on standard error
# for each step it takes, and the weighing under its title. Each `{name}` is filled in with what it names.

# The usage under the usage line.
usage:
  - "워크트리의 릴리스 빌드로 agent-host와 mcp-host를 아카이브 사본 위에서 실행하고, 기기가 싣는 만큼 부하를 실어 메모리를 잽니다."
  - "사본은 작업대 아래에 만들고, 데이터베이스 아카이브는 이 기기 서버의 임시 데이터베이스에 복원합니다. 끝나면 모두 중지하고 사본을 삭제합니다."
  - "--home은 작업 폴더를, --database는 임시 데이터베이스 이름을 지정합니다. 대체한 묶음이 300MB 이상이면 1로 끝납니다."
# The archive copied as a file.
copying_file: "아카이브 파일을 SQLite로 복사합니다"
# The archive dumped read-only and restored into the scratch database {name}.
copying_database: "아카이브 데이터베이스를 읽기 전용으로 덤프해 임시 데이터베이스 {name}에 복원합니다"
# A scratch database a stand-in that is gone left behind, dropped.
swept: "끝난 스탠드인이 남긴 임시 데이터베이스 {name}을 삭제했습니다"
# The release builds being made.
building: "릴리스 빌드를 만듭니다"
# The tools the load calls being placed, {tools} their folders.
placing: "부하에 쓰는 도구를 배치합니다: {tools}"
# The two hosts being started.
standing: "agent-host와 mcp-host를 실행합니다"
# The session records being issued and called.
loading: "작업자 기록 {workers}개, 웹 기록 {web}개, 채팅 기록 {chat}개를 발급해 한 번씩 호출합니다"
# A call that did not answer, {tool} the tool and {said} what came back.
unanswered: "{tool} 호출에 답이 없습니다: {said}"
# How many of the calls answered.
answered: "호출 {total}개 중 {answered}개가 답했습니다"
# The supervised executions and the view followers standing.
supervised: "감독 실행 {runs}개, 뷰 팔로워 {followers}개를 실행했습니다"
# The title over the machine's memory.
memory: "기기 메모리(bmo machine memory)"
# The title over the weighing.
weighed: "스탠드인이 대체한 묶음"
# The groups the stand-in's processes are weighed in.
agent_host: "agent host와 감독자"
tool_host: "도구 호스트"
followers: "뷰 팔로워"
# The total under the weighing, against the baseline and the ceiling.
total: "합계 {count}개 {held}MB (기준선 {baseline}MB, 상한 {ceiling}MB)"
# Everything being taken down.
taking_down: "모두 중지하고 사본을 삭제합니다"
# A folder named to work in that is there already.
home_stands: "이미 있는 폴더라 실행하지 않습니다: {home}"
