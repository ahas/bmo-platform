[package]
name = "herdr"
description = "The herdr socket client: herdr's own wire protocol, spoken by the herdr backend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The events read off the subscription are held in a channel until the snapshot is installed.
tokio.workspace = true
