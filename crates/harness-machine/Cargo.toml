[package]
name = "harness-machine"
description = "The harness machine: what the harness reads, writes and starts on this machine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Its binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "harness-machine"
path = "src/main.rs"
test = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
clap.workspace = true
dotenvy.workspace = true
libc.workspace = true
policy = { path = "../policy" }
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
