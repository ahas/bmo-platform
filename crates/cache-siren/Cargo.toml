[package]
name = "cache-siren"
description = "Agency's keeping of the accounts' usage windows, their readers, and its cache-lifetime judgement."
version.workspace = true
edition.workspace = true
publish = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
chrono.workspace = true
policy = { path = "../policy" }
reqwest.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
store = { path = "../store" }
tokio.workspace = true
