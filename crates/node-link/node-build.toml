# The workspace a work node builds its own binaries in (docs/work-nodes.md, 「The workplace on a node」):
# agent-host, pane-head and node-link, with the store beneath agent-host. A node's setup copies these
# crates, each to the path it holds in the repository, and this file, as Cargo.toml, into a directory of
# their own beside its copy of the code, with the repository's Cargo.lock, so a node builds these crates
# alone and nothing of the server's. The package fields, each dependency and each member are the root
# workspace's own, which a test holds this file to.

[workspace]
resolver = "3"
members = [
  "crates/agent-host",
  "crates/store",
  "crates/pane-head",
  "crates/node-link",
]

[workspace.package]
version = "0.1.0-rev.81"
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.12.1"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.177"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.138", features = ["preserve_order"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[profile.release]
debug = false
