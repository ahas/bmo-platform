[package]
name = "agent-host"
description = "The agent host: the supervisor that starts, watches and stops the executions placed in panes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Its binary holds no tests of its own, so `cargo test` links no test binary of it.
[[bin]]
name = "agent-host"
path = "src/main.rs"
test = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
chrono.workspace = true
clap.workspace = true
indexmap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sqlx.workspace = true
store = { path = "../store" }
tokio.workspace = true
