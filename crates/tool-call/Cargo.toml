[package]
name = "tool-call"
description = "Agency's side of the tool host's call protocol, which agency's placed tools share."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
