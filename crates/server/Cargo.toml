[package]
name = "agency-server"
description = "The agency service: sessions, places, lines, the co-worker pool, control routes and verbs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[[bin]]
name = "agency-server"
path = "src/bin/agency-server.rs"
test = false

[[bin]]
name = "bmo-agency"
path = "src/bin/bmo-agency.rs"
test = false

[dependencies]
agent-host = { path = "../agent-host" }
agent-session = { path = "../agent-session" }
