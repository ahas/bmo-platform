# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "web"

[test]
# The server's crate, and the client workspace, a project of its own found by its manifest and lockfile, whose
# `check` script is the console's typecheck and its tests.
languages = ["cargo", "bun"]
setup = ["cd client && bun install --frozen-lockfile"]

# The server's tests make their own scratch databases on the server, so no template is named.
[test.database]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the debt of Korean left in a code file, a file it does not
# name being allowed none; no code file of this repository holds any.
quick = ["korean", "layout", "dependencies"]
korean_ledger = "korean-ledger.json"
# The base libraries, the console plugin bundle the console extends (docs/boundary.md), and sumida, the
# server's base, a git dependency.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-artifact-client", "sumida"]

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

[build]
binaries = ["bmo-web-server"]
