[package]
name = "app-put-tool"
description = "Puts the personal app a worker run wrote for the person a session acts for, sends it back to an earlier version, or removes it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "app-put-tool"
path = "src/main.rs"
test = false

# The crate's tests stand in the root package's harness, so the library's own test target holds none: left
# on, every test build compiles the whole library a second time for an empty binary.
[lib]
test = false
doctest = false

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tool-call = { path = "../../crates/tool-call" }
