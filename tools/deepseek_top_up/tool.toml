# The supervisor tops the DeepSeek balance up by the amount the owner names (docs/tools.md, 「The DeepSeek top-up」):
# it pays on DeepSeek's web platform in the owner's own Firefox, on his profile and sign-in, paying with the card
# the console's secret store holds under the names agency's settings give, and signing in with the DeepSeek login
# held there only where DeepSeek asks. The card and the account are the platform's own: a call runs only under the
# administrator's grant.
[tool]
name = "deepseek_top_up"
protocol = 1
language = "rust"
build = 'cargo build --release -p deepseek-top-up-tool && cp "$BMO_CARGO_TARGET/release/deepseek-top-up-tool" "$BMO_TOOL_OUT/"'
check = 'cargo test -p agency-checks --test main tools::'
run = ["deepseek-top-up-tool"]

[[entry]]
namespace = "bmo"
name = "deepseek_top_up"
title = "Top the DeepSeek balance up"
description = "Top the DeepSeek balance up by the amount the owner names, in the currency DeepSeek keeps the balance in, paying with the card saved in the console's secret store on DeepSeek's platform in the owner's own Firefox on this machine, on his own profile and sign-in and out of his sight, signing in with the DeepSeek login saved there only where DeepSeek asks; call it only when the owner asks for a top-up, and again only on his new word, whatever it answered. It pays nothing while his Firefox is open, and says so. One call is held to a cap and pays at most once. Where DeepSeek or the card's issuer asks a person to confirm, it stops there and says what the person does. It answers the amount paid and the balance after, as the balance reader read it."
input = "deepseek_top_up.json"
capabilities = ["room.tools"]
grant = "platform.payment"

[entry.listing]
line = "- deepseek_top_up — top the DeepSeek balance up by the amount the owner names, paying on DeepSeek's platform with the saved card; it stops where a person must confirm"
order = 9
